[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindgenome-backend"
version = "0.1.0"
description = "Personal knowledge genome and adaptive learning platform backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MindGenome AI Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "cryptography>=43.0.1",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ASYNC", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
