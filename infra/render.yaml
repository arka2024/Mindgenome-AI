# Render Blueprint — MindGenome AI v1
# Connect the GitHub repo in Render and apply this file.
# Neo4j Aura, Qdrant Cloud, Gemini, Google OAuth, and S3/R2 are external;
# set their env vars in the Render dashboard / env group. Do not put secrets here.

previewsEnabled: false

services:
  - type: web
    name: mindgenome-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_USE_MOCKS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
