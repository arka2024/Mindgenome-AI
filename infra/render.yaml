# Render Blueprint — MindGenome AI v1
# Connect the GitHub repo in Render and apply this file.
# Neo4j Aura, Qdrant Cloud, Gemini, Google OAuth, and S3/R2 are external;
# set their env vars in the Render dashboard / env group. Do not put secrets here.

previewsEnabled: false

databases:
  - name: mindgenome-postgres
    plan: basic-256mb
    databaseName: mindgenome
    user: mindgenome
    postgresMajorVersion: 16
  - name: mindgenome-redis
    plan: starter
    ipAllowList: []

services:
  - type: web
    name: mindgenome-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mindgenome-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mindgenome-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: mindgenome-redis
          type: redis
          property: connectionString
      - fromGroup: mindgenome-secrets
    autoDeploy: true

  - type: worker
    name: mindgenome-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mindgenome-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: mindgenome-redis
          type: redis
          property: connectionString
      - fromGroup: mindgenome-secrets
    autoDeploy: true

  - type: web
    name: mindgenome-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mindgenome-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
